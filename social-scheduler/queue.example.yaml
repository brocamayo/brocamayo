# One entry per video. Add entries by hand or with:
#   python -m socialq add videos/my-video.mp4 --title "..." --caption "..." --tags a,b
#
# Required: video, publish_at. Everything else is optional.
# accounts defaults to every account in config.yaml; platforms to every platform each account has.
# tags become YouTube tags and are appended as #hashtags on Instagram/TikTok/X.
# A youtube/instagram/tiktok/x block overrides the shared text for that platform.
# per_account lets one account use different text (recommended so the two accounts aren't identical).

- id: nvda-earnings-short
  video: nvda-earnings.mp4
  publish_at: "2026-10-05 17:00"
  title: "NVIDIA earnings in 60 seconds #Shorts"
  caption: |
    Here's what actually mattered in NVIDIA's earnings - and what I'm watching next quarter.
    Not financial advice.
  tags: [investing, stocks, nvidia]
  youtube:
    description: |
      Full breakdown of NVIDIA's quarter in under a minute.

      Not financial advice.
  instagram:
    thumb_offset_ms: 2000         # which frame to use as the cover
  x:
    caption: "NVIDIA earnings in 60 seconds 📈 What mattered + what I'm watching next. #NVDA"
  per_account:
    second:
      title: "3 things from NVIDIA's earnings you missed #Shorts"
      caption: "The 3 numbers from NVIDIA's report that actually matter."

- id: dividend-myth
  video: dividend-myth.mp4
  publish_at: "2026-10-07 17:00"
  accounts: [main]                # only the main account
  platforms: [youtube, tiktok]    # only these platforms
  title: "The dividend myth nobody talks about"
  caption: "Dividends aren't free money. Here's why."
  tags: [dividends, personalfinance]
